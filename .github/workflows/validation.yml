name: Validate tokens

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate tokens
        run: npm run validate

      - name: Lint styles
        run: npm run lint:css

      - name: Build package
        run: npm run build

  # Conventional Commits gate: only runs on human-authored pull requests.
  # release-please's own Release PRs are exempt — their commits use the
  # reserved 'master' scope and would fail the scope-enum rule.
  commitlint:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint conventional commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose
